<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#174a6a">
  <title>JOTA-JOTI · Page not found</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17232d;background:#eef4f6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:#fff;border:1px solid #d9e2e7;border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(23,35,45,.10)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:54px;height:54px;object-fit:contain;border:1px solid #d9e2e7;border-radius:14px;padding:5px}.brand strong{display:block;color:#174a6a}.brand span{display:block;color:#73828a;font-size:12px;margin-top:2px}
    .code{font-size:12px;letter-spacing:1.5px;font-weight:850;color:#7b8990}.card h1{font-size:42px;line-height:1.02;color:#10354c;margin:8px 0 12px}.card p{color:#66767f;line-height:1.6;max-width:590px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:800}.primary{background:#174a6a;color:#fff}.secondary{background:#eef4f6;color:#214959}
    .route{margin-top:20px;padding:12px 13px;background:#f7fafb;border:1px solid #e0e8ec;border-radius:12px;color:#718089;font-size:12px}.route code{color:#385767;font-weight:800}
    @media(max-width:600px){.card{padding:25px;border-radius:21px}.card h1{font-size:34px}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="brand">
      <img src="photo1.png" alt="JOTA-JOTI">
      <div><strong>JOTA-JOTI 2026</strong><span>Boulder Scout Group · Unofficial portal</span></div>
    </div>
    <div class="code">404 · PAGE NOT FOUND</div>
    <h1 id="title">That page isn’t here.</h1>
    <p id="status">The address you opened doesn’t match one of the JOTA-JOTI pages.</p>
    <div class="actions">
      <a class="button primary" href="./">Back to JOTA-JOTI</a>
      <a class="button secondary" href="./setup">Open setup guide</a>
      <a class="button secondary" href="./admin">Admin centre</a>
    </div>
    <div class="route">Requested address: <code id="requested">—</code></div>
  </section>
</main>
<script>
(() => {
  const path=location.pathname.replace(/\/+$/,'').toLowerCase();
  document.getElementById('requested').textContent=location.pathname;
  async function loadCleanRoute(file) {
    try {
      const response = await fetch(file + '?route=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error('Route file could not be loaded.');
      const html = await response.text();
      const cleanPath = location.pathname;
      document.open();
      document.write(html);
      document.close();
      history.replaceState({}, '', cleanPath + location.search + location.hash);
    } catch (_) {
      // Leave the friendly 404 screen in place if the target file is unavailable.
    }
  }
  if(path.endsWith('/admin')){loadCleanRoute('./admin.html');return;}
  if(path.endsWith('/admin.html')){loadCleanRoute('./admin.html');return;}
  if(path.endsWith('/setup')){loadCleanRoute('./setup.html');return;}
  if(path.endsWith('/track')){loadCleanRoute('./track.html');return;}
  if(path.endsWith('/skip')){loadCleanRoute('./skip.html');return;}
})();
</script>
</body>
</html>
