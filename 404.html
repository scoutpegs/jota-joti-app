<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOTA-JOTI</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#18202a}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:560px;width:100%;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 40px #0001}
a{color:#5a2c84}
</style>
</head>
<body>
<main><div class="card">
<h1 id="title">Opening JOTA-JOTI…</h1>
<p id="status">Loading the requested page.</p>
<p><a href="./">Go to the countdown</a></p>
</div></main>
<script>
(async function(){
  const path = location.pathname.replace(/\/+$/,'').toLowerCase();
  const status = document.getElementById('status');
  const title = document.getElementById('title');

  let target = 'index.html';

  if (path.endsWith('/setup')) {
    target = 'index(1).html';
    title.textContent = 'Opening setup guide…';
  } else if (path.endsWith('/admin@5-6-4-3')) {
    target = 'admin.html';
    title.textContent = 'Opening admin…';
  } else if (path.endsWith('/admin') || path.endsWith('/admin.html')) {
    location.replace('./');
    return;
  }

  try {
    const r = await fetch(new URL(target, location.href), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();

    // Keep the clean route in the address bar.
    const cleanPath = location.pathname;
    document.open();
    document.write(html);
    document.close();
    try { history.replaceState({}, '', cleanPath); } catch (_) {}
  } catch (e) {
    status.textContent = 'Could not load the page. Try refreshing the GitHub Pages site.';
  }
})();
</script>
</body>
</html>
